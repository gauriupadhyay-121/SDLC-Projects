<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form class="todo-container">
        <h1>📝 My Todo List</h1>
        
        <div class="task">
            <input type="checkbox" id="task1">
            <label for="task1">Exercise for 30 Minutes</label>
        </div>

        <div class="task">
            <input type="checkbox" id="task2">
            <label for="task2">Practice English Communication</label>
        </div>

        <div class="task">
            <input type="checkbox" id="task3">
            <label for="task3">Learn Technical Skills</label>
        </div>

        <div class="task">
            <input type="checkbox" id="task4">
            <label for="task4">Complete Internship Work</label>
        </div>

        <button type="reset" class="reset-btn">
            Reset Tasks
        </button>
    </form>

</body>
</html>
